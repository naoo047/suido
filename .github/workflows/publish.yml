# 水道料金のしくみ: 毎朝 9 時（日本時間）に承認済みの事業者を 2 件公開し、サイトを作り直して GitHub Pages に出す。
# このファイルは niche_finder から nf water-sync で写したもの。直接直さない。
name: publish

on:
  schedule:
    - cron: "0 0 * * *"          # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      release:
        description: "承認済みから公開を進める（true）／作り直すだけ（false）"
        default: "false"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 承認済みから 2 件を公開の列に足す（毎朝の実行のときだけ）
        if: github.event_name == 'schedule' || github.event.inputs.release == 'true'
        run: |
          python -m generator.release --n 2
          if ! git diff --quiet data/release.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/release.csv
            git commit -m "公開: $(date -u +%F)"
            git push
          fi
      - name: サイトを作る
        run: python -m generator.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
