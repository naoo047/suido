<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営者情報 | 水道料金のしくみ</title><meta name="description" content="運営者情報"><link rel="canonical" href="https://naoo047.github.io/suido/about/"><link rel="stylesheet" href="../style.css"></head><body><header class="site"><a href="../">水道料金のしくみ</a></header><main class="wrap"><h1>運営者情報</h1><p>水道料金のしくみは、市町村の水道料金が高いのか、なぜなのかを、国の統計（総務省「地方公営企業年鑑」）の数字で調べられるよう、個人で運営しているサイトです。</p><p>数字は統計の値をそのまま使い、順位や中央値などを計算しています。評価や将来の予測はしていません。</p></main><footer class="site"><a href="../about/">運営者情報</a> ・ <a href="../privacy/">プライバシーポリシー</a><p>出典：総務省「令和6年度 地方公営企業年鑑」水道事業（施設・業務概況及び経営分析に関する調）を加工して作成</p></footer></body></html>
